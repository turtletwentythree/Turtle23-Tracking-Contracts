name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Write the Supabase connection from repository secrets, so keys never live in git.
      # Without the secrets the site still deploys and runs in demo mode.
      - name: Write runtime config
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN || 'turtle23.com' }}
          ALLOW_PASSWORD_LOGIN: ${{ vars.ALLOW_PASSWORD_LOGIN || 'false' }}
        # Values are trimmed (a pasted secret often ends with a newline) and JSON-escaped,
        # so a stray character can never break config.js and drop the site into demo mode.
        run: |
          node -e '
            const t = v => (v || "").trim();
            const cfg = {
              SUPABASE_URL: t(process.env.SUPABASE_URL).replace(/\/+$/, ""),
              SUPABASE_ANON_KEY: t(process.env.SUPABASE_ANON_KEY),
              EMAIL_DOMAIN: t(process.env.EMAIL_DOMAIN) || "turtle23.com",
              ALLOW_PASSWORD_LOGIN: t(process.env.ALLOW_PASSWORD_LOGIN) === "true"
            };
            // Only the public (publishable / anon) key may ship to the browser.
            const k = cfg.SUPABASE_ANON_KEY;
            let role = "";
            try { role = JSON.parse(Buffer.from(k.split(".")[1], "base64url").toString()).role || ""; } catch (e) {}
            if (k.startsWith("sb_secret_") || role === "service_role") {
              cfg.SUPABASE_ANON_KEY = "";
              console.log("::error::SUPABASE_ANON_KEY holds a SECRET key. It was NOT published. Put the Publishable (sb_publishable_) or anon key in this secret instead.");
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "secret_key=true\n");
            }
            console.log("SUPABASE_URL set:", Boolean(cfg.SUPABASE_URL), "| SUPABASE_ANON_KEY set:", Boolean(cfg.SUPABASE_ANON_KEY));
            if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) console.log("::warning::Supabase secrets are missing, the site will run in demo mode");
            require("fs").writeFileSync("assets/config.js", "window.APP_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n");
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # The site was still deployed (without the key) so a leaked secret is taken down; now fail loudly.
      - name: Fail if a secret key was supplied
        if: steps.config.outputs.secret_key == 'true'
        run: |
          echo "::error::Replace the SUPABASE_ANON_KEY secret with the Publishable key and rotate the leaked secret key in Supabase."
          exit 1
